name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches tauri.conf.json
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version src-tauri/tauri.conf.json)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      # ubuntu-latest ships the Android SDK; setup-android@v3 fails on the removed "tools" package.
      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          cp src-tauri/gen/android/keystore.properties lockdown/keystore.properties

      - run: pnpm tauri android build --target aarch64 armv7 --apk --ci

      # Lockdown with this signer bundled, and the QR code a factory-reset phone scans to download it from this release
      - name: Build Lockdown and the provisioning QR code
        run: |
          sudo apt-get update && sudo apt-get install -y qrencode
          apk="bitwasm-signer-$GITHUB_REF_NAME.apk"
          lockdown="signer-lockdown-$GITHUB_REF_NAME.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          lockdown/provision.sh "$apk" "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$lockdown"
          cp lockdown/out/lockdown.apk "$lockdown"
          cp lockdown/out/provisioning.png "provisioning-$GITHUB_REF_NAME.png"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="bitwasm-signer-$GITHUB_REF_NAME.apk signer-lockdown-$GITHUB_REF_NAME.apk provisioning-$GITHUB_REF_NAME.png"
          sha256sum $assets > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" $assets SHA256SUMS --draft --title "$GITHUB_REF_NAME"
