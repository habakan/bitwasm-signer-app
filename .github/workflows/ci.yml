name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The web engine's toolchain is pinned (web/engine/rust-toolchain.toml) so a fork builds the same app
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/engine

      - run: pnpm install --frozen-lockfile
      - name: Design tokens are generated
        run: pnpm tokens && git diff --exit-code
      - run: pnpm build
      - run: pnpm build:web
      - name: Web app build name, which a build of this commit anywhere should match
        run: |
          pnpm build:pwa
          grep -o 'NAME + "[0-9a-f]*"' dist-web/app/sw.js | tr -d '"' | sed 's/NAME + /web app build: /' | tee -a "$GITHUB_STEP_SUMMARY"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tauri needs the WebKitGTK headers to compile on Linux
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/plugins/signer

      - run: cargo test --manifest-path src-tauri/plugins/signer/Cargo.toml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      # Without keystore.properties the release APK is built unsigned
      - run: pnpm tauri android build --target aarch64 --apk --ci
