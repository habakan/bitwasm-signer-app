[package]
name = "bitwasm-signer-app"
version = "0.1.1"
description = "Cross-platform Bitcoin signer using bitwasm-signer WASM"
authors = ["DIYSigner"]
edition = "2021"


[lib]
name = "bitwasm_signer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-signer = { path = "plugins/signer" }


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
