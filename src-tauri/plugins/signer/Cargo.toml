[package]
name = "tauri-plugin-signer"
version = "0.1.0"
authors = [ "DIYSigner" ]
description = ""
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-signer"

[dependencies]
tauri = { version = "2" }
serde = "1.0"
thiserror = "2"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
wasmi = {
    version = "2.0.0",
    default-features = false,
    features = ["stable", "std", "validate", "auto-dispatch"],
}
zeroize = "1"

[target.'cfg(target_os = "ios")'.dependencies]
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"
wasmi = {
    version = "2.0.0",
    default-features = false,
    features = ["stable", "std", "validate", "auto-dispatch"],
}
zeroize = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
