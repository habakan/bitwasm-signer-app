[package]
name = "bitwasm-web-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = "1.0"
serde_json = "1"
sha2 = "0.10"
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "auto-dispatch"] }
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
