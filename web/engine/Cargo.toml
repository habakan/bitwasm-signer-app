[package]
name = "bitwasm-web-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The QR reader of bitwasm-signer, linked in so a SeedQR is decoded and loaded without reaching the page
bitwasm-signer-qr = { git = "https://github.com/bitwasm-project/bitwasm-signer", rev = "04e12c8057824d7231057b3ea45f215890beea87", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.12"
serde = "1.0"
serde_json = "1"
sha2 = "0.10"
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "auto-dispatch"] }
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
# The name section holds mangled names whose hashes depend on the machine that built them
strip = true
